# App Engine standard. The runtime must be at least the go directive in go.mod.
runtime: go126

handlers:
- url: /static
  static_dir: web/static
  secure: always
# The 2016 app (web/legacy). static_dir serves no index, so /legacy/ needs its own line.
# noindex keeps it out of search results next to the app (the Go server sends
# the same header when it serves /legacy locally).
- url: /legacy/?
  static_files: web/legacy/index.html
  upload: web/legacy/index\.html
  secure: always
  http_headers:
    X-Robots-Tag: noindex
- url: /legacy
  static_dir: web/legacy
  secure: always
  http_headers:
    X-Robots-Tag: noindex
# The developer docs (docs/, built into web/docs by `make docs`). static_dir
# serves no index page, so a folder URL is sent to its index.html, and one
# without its trailing slash gets it too. The pages carry their own noindex
# meta tag while the site is new (docs/content/SiteMetadata.json).
- url: /docs/?
  static_files: web/docs/index.html
  upload: web/docs/index\.html
  secure: always
- url: /docs/(.+)/
  static_files: web/docs/\1/index.html
  upload: web/docs/.+/index\.html
  secure: always
- url: /docs/([^.]+)
  static_files: web/docs/\1/index.html
  upload: web/docs/[^.]+/index\.html
  secure: always
- url: /docs
  static_dir: web/docs
  secure: always
- url: /.*
  script: auto
  secure: always
