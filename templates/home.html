        <div class="col-sm-9 col-sm-offset-3 col-md-12 col-md-offset-0 main">
			<center>
				<div id = "beatImageContainer"
					 style = "width: 250px; height: 250px; border: solid 2px black; overflow: hidden; margin: 20px">
				</div>
			</center>
			<div style = "text-align: center; border: solid 0px red;padding: 10px">
				<button id = "restartBeatButton">Restart</button>
				<button id = "prevBeatButton">Prev</button>
				<button id = "startStopButton">Start</button>
				<button id = "nextBeatButton">Next</button>
			</div>

			<div style = "text-align: center; border: solid 0px red;padding: 10px">
				Tempo: <label id = "tempoLabel"></label> 
				<div id = "tempoSlider" />
			</div>
			<div style = "text-align: center; border: solid 0px red;padding: 10px">

	<div id = "imagesDiv" hidden = "true">

	<script src="/static/js/lgsounds.js"></script>
	<script src="/static/js/layagnana.js"></script>
	<script language = "javascript">
		var lgContext = null;
		var beatImageContainer = null;
		var lgPlayer = null;
		var beatGenerator = null;
		$(function() {
			lgContext = new LG.Context();
			beatImageContainer = $("#beatImageContainer");
			lgPlayer = new LG.BeatPlayer(lgContext, beatImageContainer);
			beatGenerator = new LG.SimpleBeatGenerator([
				{
					"name": "down",
					"duration": 1.5,
					"ticks": [ {"sound": "down", "offset": 0},
							   {"sound": "down", "offset": 1/3} ]
				},
				"one",
				"two",
				"three",
				"down",
				"open",
				"down",
				"open",
			]);
			setupControls();
			setupLG();
		});
	</script>
