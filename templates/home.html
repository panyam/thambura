
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta name="description" content="">

    <title>Dashboard Template for Bootstrap</title>

    <!-- Bootstrap core CSS -->
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="/static/css/dashboard.css" rel="stylesheet">

	<link rel="stylesheet" href="https://code.jquery.com/ui/1.11.4/themes/smoothness/jquery-ui.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body>

    <nav class="navbar navbar-inverse navbar-fixed-top">
      <div class="container-fluid">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="#">Laya Gnana</a>
        </div>
        <div id="navbar" class="navbar-collapse collapse">
			<!--
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Help</a></li>
          </ul>
			-->
        </div>
      </div>
    </nav>

    <div class="container">
		<div class = "row" style="border: solid 0px green">
			<div id = "player_div" class = "col-md-12" style="vertical-align: bottom; border: solid 0px blue">
				<center>
					<div id = "beatImageContainer"
					 	style = "width: 250px; height: 250px; border: solid 2px black; overflow: hidden; padding: 20px">
					</div>
				<div style = "border: solid 0px red;padding: 10px">
					<button id = "restartBeatButton">Restart</button>
					<button id = "prevBeatButton">Prev</button>
					<button id = "startStopButton">Start</button>
					<button id = "nextBeatButton">Next</button>
				</div>
				</center>
        	</div>
			<div id = "tempo_div" class = "col-md-12" style = "text-align: center; border: solid 0px red;padding: 20px">
				<label>Tempo:</label> <input type = "number" id = "tempoTextField"/> bpm
				<div style = "text-align: center; border: solid 0px red;padding: 10px">
					<div id = "tempoSlider"/>
				</div>
			</div>
			<div id = "settings_div" class = "col-md-4 col-md-offset-4" style="border: solid 0px blue">
				<table style="width: 100%">
					<tr>
						<td><label>Tala:</label>
						<td>
							<select style="width: 100%">
								<optgroup label = "Sapta Thaalas">
									<option>Eka</option>
									<option>Rupakam</option>
									<option>Matya</option>
									<option>Jhumpa</option>
									<option>Thriputa</option>
									<option>Ata</option>
									<option>Dhruva</option>
								</optgroup>
								<optgroup label = "Chaapu Thaalas">
									<option>Thisra Chaapu</option>
									<option>Chathusra Chaapu</option>
									<option>Khanda Chaapu</option>
									<option>Misra Chaapu</option>
									<option>Sankeerna Chaapu</option>
								</optgroup>
								<optgroup label = "Custom">
									<option>Adi</option>
									<option>Short Rupakam</option>
								</optgroup>
							</select>
						</td>
					</tr>
					<tr>
						<td><label>Gathi/Nadai:</label>
						<td>
							<select style="width: 100%">
								<option value = "3">Thisram</option>
								<option value = "4">Chathusram</option>
								<option value = "5">Khandam</option>
								<option value = "7">Misram</option>
								<option value = "9">Sankeernam</option>
							</select>
						</td>
					</tr>
					<tr>
						<td><label>Jaathi:</label>
						<td>
							<select style="width: 100%">
								<option value = "3">Thisram</option>
								<option value = "4">Chathusram</option>
								<option value = "5">Khandam</option>
								<option value = "7">Misram</option>
								<option value = "9">Sankeernam</option>
							</select>
						</td>
					</tr>
					<tr>
						<td><label>Kalai:</label>
						<td>
							<select style="width: 100%">
								<option value = "1">1</option>
								<option value = "2">2</option>
								<option value = "3">3</option>
								<option value = "4">4</option>
								<option value = "5">5</option>
							</select>
						</td>
					</tr>
					<tr>
						<td><label>Sounds:</label>
						<td><select id = "soundGroupsSelect" style="width: 100%"/></td>
					</tr>
					<tr>
						<td><label>Images:</label>
						<td><select id = "imageGroupsSelect" style="width: 100%"/></td>
					</tr>
					</table>
				<div>
			</div>
		</div>
    </div>

    <!-- Bootstrap core JavaScript
    ================================================== -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>

    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/js/lgcore.js"></script>
	<script src="/static/js/lgmodel.js"></script>
	<script src="/static/js/lgimages.js"></script>
	<script src="/static/js/lgsounds.js"></script>
	<script src="/static/js/lgview.js"></script>
	<script language = "javascript"> $(function() { LGView.initialize(); }); </script>
  </body>
</html>
