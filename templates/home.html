  <body>

    <nav class="navbar navbar-inverse navbar-fixed-top">
      <div class="container-fluid">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="#">Laya Gnana</a>
        </div>
        <div id="navbar" class="navbar-collapse collapse">
			<!--
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Help</a></li>
          </ul>
			-->
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-3 col-md-2 sidebar">
          <ul class="nav nav-sidebar">
            <!--<li class="active"><a href="#">Overview <span class="sr-only">(current)</span></a></li>
            <li><a href="#">Reports</a></li>-->
          </ul>
        </div>
        <div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
			<center>
				<div id = "beatImageContainer"
					 style = "width: 250px; height: 250px; border: solid 1px red; overflow: hidden">
				</div>
			</center>
			<div style = "text-align: center; border: solid 1px red;">
				<button id = "restartBeatButton">Restart</button>
				<button id = "prevBeatButton">Prev</button>
				<button id = "startStopButton">Start</button>
				<button id = "nextBeatButton">Next</button>
			</div>

			<div style = "text-align: center; border: solid 1px red;">
				BPM: <input type = "text" id = "bpmTextField" value = "80"/>
				<br/>
				Sounds: <select id = "soundGroups" onchange = "soundGroupChanged()"></select>
				Images: <select id = "imageGroups" onchange = "imageGroupChanged()"></select>
			</div>
        </div>
      </div>
    </div>

	<div id = "imagesDiv" hidden = "true">
	</div>
    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
    <!-- Just to make our placeholder images work. Don't actually copy the next line! -->
    <script src="/static/js/holder.js"></script>
    <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->
    <script src="/static/assets/js/ie10-viewport-bug-workaround.js"></script>
	<script src="/static/js/lgcore.js"></script>
	<script src="/static/js/lgimages.js"></script>
	<script src="/static/js/lgsounds.js"></script>
	<script src="/static/js/layagnana.js"></script>
	<script language = "javascript">
		var lgContext = new LG.Context();
		var beatImageContainer = $("#beatImageContainer");
		var lgPlayer = new LG.BeatPlayer(lgContext, beatImageContainer);
		var beatGenerator = new LG.SimpleBeatGenerator([
			"down",
			"one",
			"two",
			"three",
			"down",
			"open",
			"down",
			"open",
		]);
		lgPlayer.setGenerator(beatGenerator);
		lgContext.loadFrom("/static/Resources/TalasFixtures.json", function(context, error) {
			// load the sounds
			$("#soundGroups").empty();
			for (var groupName in context.soundGroups)
			{
				$("#soundGroups").append("<option value='" + groupName + "'>" + groupName + "</option>");
			}
			soundGroupChanged();

			$("#imageGroups").empty();
			for (var groupName in context.imageGroups)
			{
				$("#imageGroups").append("<option value='" + groupName + "'>" + groupName + "</option>");
			}
			imageGroupChanged();
		});

		function soundGroupChanged() {
			var groupName = $("#soundGroups").val();
			lgContext.loadSoundGroup(groupName, function(soundGroup) {
			});
		}

		function imageGroupChanged() {
			var groupName = $("#imageGroups").val();
			lgContext.loadImageGroup(groupName, function(imageGroup) {
				beatImageContainer.html("");
				beatImageContainer.append(lgContext.imageGroups[groupName].images["down"].imageElement);
			});
		}

		$("#restartBeatButton").click(function() {
			beatGenerator.restart();	
		});

		$("#nextBeatButton").click(function() {
			if (!lgPlayer.isPlaying())
			{
				lgContext.currentGenerator.forward();
			}
		});

		$("#prevBeatButton").click(function() {
			if (!lgPlayer.isPlaying())
			{
				lgContext.currentGenerator.backward();
			}
		});

		$("#startStopButton").click(function() {
			if (!lgPlayer.isPlaying())
			{
				lgPlayer.startPlaying();
				$("#startStopButton").html("Stop");
			} else {
				lgPlayer.stopPlaying();
				$("#startStopButton").html("Start");
			}
		});
	</script>
  </body>
</html>
