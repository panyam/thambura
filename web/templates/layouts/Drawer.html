<!-- thambura/web/templates/layouts/Drawer.html -->
<!--
The home page's layout: the tala fills the page (slot "main"), the page's own
text follows it, and the thambura sits in a drawer that slides up from the
bottom (slot "drawer"), with its floating controls. Which island goes in each
slot, and its config, comes from the page spec (internal/page), written into
the page by PageScripts below.

Pages include this file, define "PageContent" (what follows the main slot,
inside <main>), and render "BasePage". Slots are elements with data-slot; an
island owns its slot element's children once mounted.
-->
{{# include "../BasePage.html" #}}
{{# include "../page/Islands.html" #}}

{{ define "BodySection" }}
<main class="flex-1 overflow-auto">
    <div data-slot="main" class="mx-auto w-full max-w-3xl px-4 py-6 sm:py-10">
        <noscript>Thambura needs JavaScript to play.</noscript>
    </div>
{{ template "PageContent" . }}
</main>
<!-- The drawer slot: the thambura island finds its bar mount and its
     floating controls in here (web/src/player/thamburaIsland.tsx). -->
<div data-slot="drawer">
    <!-- The thambura bar (web/src/player/ThamburaBar.tsx) mounts here; it floats over the page. -->
    <div id="thambura"></div>
    <!-- The page's floating controls: Start all (the tala and the thambura),
         and open the thambura's bar.
         thamburaIsland.tsx binds them by id and keeps their state in step. They
         step aside while the bar is open, which carries the same two controls in
         its own header. They share a centre line, so the round button sits over
         the middle of the pill. -->
    <div id="thambura-controls"
         class="pointer-events-none fixed right-4 z-40 flex flex-col items-center gap-3 transition-[opacity,transform] duration-200 ease-out print:hidden"
         style="bottom: calc(1rem + env(safe-area-inset-bottom, 0px))">
        <button id="play-all" type="button" data-playing="false" aria-pressed="false"
                class="group pointer-events-auto flex h-12 w-12 items-center justify-center rounded-full border border-gray-300 bg-white text-gray-700 shadow-lg hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 focus-visible:ring-offset-2 data-[playing=true]:border-amber-600 data-[playing=true]:bg-amber-600 data-[playing=true]:text-white dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700 dark:focus-visible:ring-offset-gray-900"
                aria-label="Start all" title="Start the tala and the thambura (Space)">
            <svg class="h-5 w-5 group-data-[playing=true]:hidden" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4v12l10-6z"/></svg>
            <svg class="hidden h-5 w-5 group-data-[playing=true]:block" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg>
        </button>
        <button id="thambura-toggle" type="button" aria-expanded="false" aria-controls="thambura"
                class="pointer-events-auto flex h-14 w-14 items-center justify-center gap-2 rounded-full bg-amber-600 text-white shadow-lg hover:bg-amber-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 focus-visible:ring-offset-2 sm:w-auto sm:pl-5 sm:pr-6 dark:focus-visible:ring-offset-gray-900"
                aria-label="Thambura" title="Show the thambura">
            <!-- A tambura, tilted so it fills the square: the gourd solid, the
                 neck and its tuning pegs chunky enough to read on a phone, where
                 the icon is the whole button. -->
            <svg class="h-8 w-8 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <g transform="rotate(-20 12 12)">
                    <circle cx="12" cy="16.2" r="6.6" fill="currentColor" stroke="none"/>
                    <path d="M10 13.6V4.6q0-2 2-2t2 2v9" stroke-width="1.9"/>
                    <path d="M7.7 5.6h2.2M14.1 5.6h2.2M7.7 8.6h2.2M14.1 8.6h2.2" stroke-width="1.9"/>
                </g>
            </svg>
            <span class="hidden whitespace-nowrap text-sm font-semibold sm:inline">Thambura</span>
        </button>
    </div>
</div>
{{ end }}

{{ define "PageScripts" }}
{{ template "PageSpecScript" .Spec }}
<script type="module" src="/static/app.js"></script>
{{ end }}
