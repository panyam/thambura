<!-- thambura/web/templates/layouts/Tracks.html -->
<!--
The home page's layout (#101): the tala (slot "main") and the track list
(slot "tracks"), a card per instrument. On a phone the tracks follow the
tala in one column; from lg up the tala keeps a column on the left and the
cards fill the rest. The floating play button is Start all, in reach
wherever the page is scrolled (session.ts, wireFloatingPlay). Which island
goes in each slot comes from the page spec (internal/page), written by
PageScripts.

Pages include this file, define "PageContent" (shown under the tracks) and
render "BasePage".
-->
{{# include "../BasePage.html" #}}
{{# include "../page/Islands.html" #}}

{{ define "BodySection" }}
<main class="flex-1 overflow-auto">
    <div class="mx-auto grid w-full max-w-screen-2xl gap-6 px-4 py-6 sm:py-10 lg:grid-cols-[28rem_minmax(0,1fr)] lg:items-start">
        <div data-slot="main" class="min-w-0">
            <noscript>Thambura needs JavaScript to play.</noscript>
        </div>
        <div data-slot="tracks" class="min-w-0"></div>
    </div>
{{ template "PageContent" . }}
</main>
<div class="pointer-events-none fixed right-4 z-40 print:hidden" style="bottom: calc(1rem + env(safe-area-inset-bottom, 0px))">
    <button id="play-all" type="button" data-playing="false" aria-pressed="false"
            class="group pointer-events-auto flex h-12 w-12 items-center justify-center rounded-full border border-gray-300 bg-white text-gray-700 shadow-lg hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 focus-visible:ring-offset-2 data-[playing=true]:border-amber-600 data-[playing=true]:bg-amber-600 data-[playing=true]:text-white dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700 dark:focus-visible:ring-offset-gray-900"
            aria-label="Start all" title="Start the tala and the thambura (Space)">
        <svg class="h-5 w-5 group-data-[playing=true]:hidden" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4v12l10-6z"/></svg>
        <svg class="hidden h-5 w-5 group-data-[playing=true]:block" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg>
    </button>
</div>
{{ end }}

{{ define "PageScripts" }}
{{ template "PageSpecScript" .Spec }}
<script type="module" src="/static/app.js"></script>
{{ end }}
