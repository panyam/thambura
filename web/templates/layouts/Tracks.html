<!-- thambura/web/templates/layouts/Tracks.html -->
<!--
A labs layout: the tala (slot "main") and the track list (slot "tracks"), a
card per instrument. On a phone the tracks follow the tala in one column;
from lg up the tala keeps a column on the left and the cards fill the rest. No drawer and no floating controls: the thambura is one of the cards.
Which island goes in each slot comes from the page spec (internal/page),
written by PageScripts.

Pages include this file, define "PageContent" (shown under the tracks) and
render "BasePage". The page must carry .Lab for the banner.
-->
{{# include "../BasePage.html" #}}
{{# include "../page/Islands.html" #}}
{{# include "./LabsBanner.html" #}}

{{ define "BodySection" }}
<main class="flex-1 overflow-auto">
    {{ template "LabsBanner" . }}
    <div class="mx-auto grid w-full max-w-screen-2xl gap-6 px-4 py-6 sm:py-10 lg:grid-cols-[28rem_minmax(0,1fr)] lg:items-start">
        <div data-slot="main" class="min-w-0">
            <noscript>Thambura needs JavaScript to play.</noscript>
        </div>
        <div data-slot="tracks" class="min-w-0"></div>
    </div>
{{ template "PageContent" . }}
</main>
{{ end }}

{{ define "PageScripts" }}
{{ template "PageSpecScript" .Spec }}
<script type="module" src="/static/app.js"></script>
{{ end }}
